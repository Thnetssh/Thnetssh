name: Build XUM Emulador 6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar projeto Android
        shell: bash
        run: |
          echo '' | base64 -d > "settings.gradle"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > "build.gradle"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=' | base64 -d > "gradle.properties"
          mkdir -p "app"
          echo '' | base64 -d > "app/build.gradle"
          mkdir -p "app/src/main"
          echo '' | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "app/src/main/java/com/thnetssh/xumemulador6"
          echo '' | base64 -d > "app/src/main/java/com/thnetssh/xumemulador6/MainActivity.java"
          mkdir -p "app/src/main/assets"
          echo '' | base64 -d > "app/src/main/assets/index.html"
            - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XUM_Emulador_6.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: XUM-Emulador-6-APK
          path: XUM_Emulador_6.apk
          if-no-files-found: error
