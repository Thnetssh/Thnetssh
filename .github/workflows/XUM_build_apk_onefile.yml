name: Build XUM Emulador 6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar projeto XUM Emulador 6
        shell: bash
        run: |
          set -euo pipefail

          # Esta versão anterior do workflow contém os arquivos completos
          # do projeto Android codificados em Base64.
          SOURCE_COMMIT="3c97c5ef899b8fa224f4b63ab50375081e5fad2e"
          SOURCE_PATH=".github/workflows/XUM_build_apk_onefile.yml"

          git show "${SOURCE_COMMIT}:${SOURCE_PATH}" > /tmp/xum_source.yml

          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path("/tmp/xum_source.yml").read_text(encoding="utf-8")

          pattern = re.compile(
              r"^\s*echo '([A-Za-z0-9+/=]+)' \| base64 -d > \"([^\"]+)\"\s*$",
              re.MULTILINE,
          )

          files = pattern.findall(source)

          if not files:
              raise SystemExit("Nenhum arquivo Base64 do projeto foi encontrado.")

          for payload, target in files:
              target_path = Path(target)
              target_path.parent.mkdir(parents=True, exist_ok=True)
              target_path.write_bytes(base64.b64decode(payload))
              print(f"Criado: {target}")

          required = [
              "settings.gradle",
              "build.gradle",
              "gradle.properties",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/java/com/thnetssh/xumemulador6/MainActivity.java",
              "app/src/main/assets/index.html",
          ]

          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("Arquivos obrigatórios ausentes: " + ", ".join(missing))

          print("Projeto XUM Emulador 6 recuperado com sucesso.")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Renomear APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XUM_Emulador_6.apk
          ls -lh XUM_Emulador_6.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: XUM-Emulador-6-APK
          path: XUM_Emulador_6.apk
          if-no-files-found: error
          retention-days: 30
